# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ocr_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=ocr_auth:10m rate=3r/s;
limit_req_status 429;

upstream ocr_backend {
    server ocr:4567;
    keepalive 32;
}

server {
    listen 8001;
    server_name _;

    # Generous body size limit for multi-page book scans and high-resolution PDFs
    client_max_body_size 250M;
    client_body_buffer_size 16M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================================
    # Anti-Scanner & Hack Probe Defense (Instant Connection Drop 444)
    # ========================================================

    # 1. Block all hidden dotfiles (.env, .git, .aws, .local, etc.)
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # 2. Block sensitive probe extensions (PHP, ENV, YAML, INI, SQL, BAK, etc.)
    location ~* \.(php|env|ini|yml|yaml|bak|save|backup|config|cgi|aspx?|jsp|sh|bash|sql|log|conf)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    # 3. Block common CMS, exploit, and profiler URL prefixes
    location ~* ^/(phpinfo|_profiler|app_dev\.php|wp-admin|wp-content|wp-includes|laravel|debug/default|actuator|telescope) {
        access_log off;
        log_not_found off;
        return 444;
    }

    # ========================================================
    # Rate Limiting & Proxy Routing
    # ========================================================

    # Protected Auth Endpoint: Strict rate limit to prevent credential brute force
    location /api/auth/login {
        limit_req zone=ocr_auth burst=5 nodelay;

        proxy_pass http://ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Main Application Proxy (Web UI, API Endpoints & Book Extraction)
    location / {
        limit_req zone=ocr_general burst=50 nodelay;

        proxy_pass http://ocr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for multi-page OCR document processing and LLM reconciliation
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering to allow streaming responses
        proxy_buffering off;
    }
}
