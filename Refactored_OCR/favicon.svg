<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Crimson Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f43f5e" stroke-width="1.5" filter="url(#glow)" />

  <!-- Document Outline with Corner Fold -->
  <path d="M19 14 H38 L47 23 V50 C47 51.5 45.5 53 44 53 H19 C17.5 53 16 51.5 16 50 V17 C16 15.5 17.5 14 19 14 Z" 
        fill="#09090b" fill-opacity="0.5" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Corner Fold Flap -->
  <path d="M38 14 V23 H47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Document Content Text Lines -->
  <line x1="22" y1="28" x2="34" y2="28" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="35" x2="41" y2="35" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="22" y1="42" x2="37" y2="42" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <line x1="22" y1="48" x2="30" y2="48" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Horizontal Laser Scan Line with Glow -->
  <rect x="12" y="32" width="40" height="2.5" rx="1.25" fill="url(#laserGrad)" filter="url(#glow)" />

  <!-- Targeting Brackets (Corner Marks) -->
  <path d="M12 20 V15 H17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M52 20 V15 H47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M12 44 V49 H17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M52 44 V49 H47" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
