<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه استخراج هوشمند متن قائمیه</title>

    <!-- Google Fonts: Vazirmatn (Persian), Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', '"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        crimson: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                            950: '#4c0519',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-[#09090b] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-red-600 selection:text-white relative overflow-hidden">

    <!-- Ambient Crimson Background Glows -->
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-red-600/15 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-rose-700/10 rounded-full blur-[140px] pointer-events-none"></div>

    <div x-data="loginApp()" class="w-full max-w-md relative z-10">
        
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-red-500 to-red-800 p-0.5 shadow-xl shadow-red-900/30 mb-4">
                <div class="w-full h-full bg-[#121215] rounded-[14px] flex items-center justify-center">
                    <i data-lucide="scan-text" class="w-8 h-8 text-red-500"></i>
                </div>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">سامانه استخراج متن قائمیه</h1>
            <p class="text-xs text-slate-400 mt-1">ورود به پنل کاربری و مدیریت سامانه OCR</p>
        </div>

        <!-- Glassmorphism Card -->
        <div class="bg-[#121215]/80 backdrop-blur-xl border border-red-500/20 rounded-2xl p-7 shadow-2xl shadow-red-950/20">
            
            <!-- Error Alert -->
            <div x-show="errorMessage" x-cloak class="mb-5 p-3 rounded-xl bg-red-950/60 border border-red-500/40 text-red-200 text-xs flex items-center space-x-2 space-x-reverse">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i>
                <span x-text="errorMessage"></span>
            </div>

            <form @submit.prevent="submitLogin()" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">نام کاربری</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="text" 
                            x-model="username" 
                            required 
                            placeholder="admin"
                            class="w-full pl-3.5 pr-10 py-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800 focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-white placeholder-slate-500 transition outline-none"
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">رمز عبور</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input 
                            :type="showPassword ? 'text' : 'password'" 
                            x-model="password" 
                            required 
                            placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800 focus:border-red-500 focus:ring-1 focus:ring-red-500 text-sm text-white placeholder-slate-500 transition outline-none"
                        />
                        <button 
                            type="button" 
                            @click="showPassword = !showPassword"
                            class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 hover:text-white"
                        >
                            <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    :disabled="loading"
                    class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-red-600 to-rose-700 hover:from-red-500 hover:to-rose-600 text-white font-semibold text-sm shadow-lg shadow-red-700/30 transition flex items-center justify-center space-x-2 space-x-reverse disabled:opacity-50"
                >
                    <span x-show="!loading">ورود به سامانه</span>
                    <span x-show="loading" x-cloak class="flex items-center space-x-2 space-x-reverse">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                        <span>در حال بررسی...</span>
                    </span>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-500 mt-6">
            سامانه پردازش اسناد و OCR قائمیه &bull; نسخه ۳.۶.۲
        </p>
    </div>

    <script>
        function loginApp() {
            return {
                username: '',
                password: '',
                showPassword: false,
                loading: false,
                errorMessage: '',
                async submitLogin() {
                    this.loading = true;
                    this.errorMessage = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            throw new Error(data.detail || 'خطا در برقراری ارتباط');
                        }
                        
                        const params = new URLSearchParams(window.location.search);
                        const nextUrl = params.get('next');
                        if (nextUrl && nextUrl.startsWith('/')) {
                            window.location.href = nextUrl;
                        } else if (data.user && data.user.is_admin) {
                            window.location.href = '/admin';
                        } else {
                            window.location.href = '/';
                        }
                    } catch (err) {
                        this.errorMessage = err.message;
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                }
            }
        }
        document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    </script>
</body>
</html>
